# SSHNat 三平台桌面客户端构建
#
# 产物为原生桌面应用（Wails v3 壳）：
#   - Windows: bin/sshnat.exe   (WebView2)
#   - Linux:   bin/sshnat       (WebKitGTK)
#   - macOS:   bin/sshnat.app   (WKWebView)
#
# 另附纯 Go headless 守护进程 sshnatd 的交叉编译产物（无需 CGO）。

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  gui:
    name: GUI · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-amd64
          - os: ubuntu-latest
            name: Linux-amd64
          - os: macos-latest
            name: macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Linux 需要 WebKitGTK 开发头文件（系统 WebView 渲染层）
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install wails3 CLI
        env:
          CGO_ENABLED: "0"
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.11

      - name: Build
        shell: bash
        run: |
          npm --prefix frontend ci || npm --prefix frontend install
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "CGO_ENABLED=$(go env CGO_ENABLED)"
            pkg-config --modversion gtk+-3.0
            pkg-config --modversion webkit2gtk-4.1
            # Wails v3 defaults to GTK4; the runner dependencies above use the
            # stable GTK3/WebKitGTK 4.1 toolchain, so select the matching tag.
            CGO_ENABLED=1 wails3 task build HAS_CC=true EXTRA_TAGS=gtk3
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            wails3 task darwin:package
          else
            wails3 task build
          fi

      - name: Collect artifacts (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp -r bin/sshnat.app dist/ 2>/dev/null || true
          cp bin/sshnat dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: sshnat-gui-${{ matrix.name }}
          path: |
            bin/sshnat.exe
            dist/*

  daemon:
    name: Daemon · ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Cross compile
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" \
            -o dist/sshnatd-${{ matrix.goos }}-${{ matrix.goarch }}${ext} ./cmd/sshnatd
      - uses: actions/upload-artifact@v4
        with:
          name: sshnatd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [gui, daemon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DIR="$GITHUB_WORKSPACE/release-files"
          mkdir -p "$OUTPUT_DIR"
          command -v zip >/dev/null || { echo "zip is required" >&2; exit 1; }
          for artifact in release/*; do
            if [ -d "$artifact" ]; then
              name="$(basename "$artifact")"
              case "$name" in
                sshnat-gui-Windows-*|sshnat-gui-macOS-*|sshnatd-windows-*)
                  (cd "$artifact" && zip -qr "$OUTPUT_DIR/${name}.zip" .)
                  ;;
                *)
                  tar -C "$artifact" -czf "$OUTPUT_DIR/${name}.tar.gz" .
                  ;;
              esac
            fi
          done
          ls -lh "$OUTPUT_DIR"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          tag_name: ${{ github.ref_name }}
          name: SSHNat ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

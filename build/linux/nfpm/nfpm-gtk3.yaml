# GTK3/WebKitGTK 4.1 packages. Selected automatically by EXTRA_TAGS=gtk3.
name: "sshnat"
arch: ${GOARCH}
platform: "linux"
version: "1.1.0"
section: "default"
priority: "extra"
maintainer: "SSHNat contributors"
description: "SSH port forwarding client"
vendor: "SSHNat"
homepage: "https://github.com/youyou-9/sshnat"
license: "MIT"
release: "1"
contents:
  - src: "./bin/sshnat"
    dst: "/usr/local/bin/sshnat"
    file_info:
      mode: 0755
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/sshnat.png"
  - src: "./build/linux/sshnat.desktop"
    dst: "/usr/share/applications/sshnat.desktop"
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
